[pytest]
# `pythonpath = .` makes the project root importable so `import soar` works
# without an install step. There is deliberately no venv in this project
# (AGENTS.md section 7) -- everything runs inside the pinned container.
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# -ra  : summary of every non-passing outcome, so a skipped step is never silent
# --strict-markers : a typo'd @pytest.mark fails instead of silently doing nothing
addopts = -ra --strict-markers --strict-config

# Forensic tests read fixtures/volatility/, which is deliberately NOT executable
# data. No test may require network access (AGENTS.md section 5.5).
filterwarnings =
    error::DeprecationWarning:soar.*