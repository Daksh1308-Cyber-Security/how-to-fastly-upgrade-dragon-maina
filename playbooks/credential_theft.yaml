# Credential theft response playbook
#
# Covers NIST SP 800-61 rev2 Detection -> Containment -> Eradication -> Recovery.
# Containment is gated on severity; only `critical` runs unattended.

id: credential_theft
name: Credential Theft Response
description: >-
  Credential access incident (LSASS dumping, brute force, token theft). Lock
  the affected account, isolate the source host, collect authentication
  evidence, remove the credential-dumping artifact, then verify.
phases:
  - detection
  - containment
  - eradication
  - recovery
mitre_techniques:
  - T1003
  - T1558
  - T1056
min_severity: low

actions:
  # --- Detection -------------------------------------------------------------
  - id: triage_alert
    name: Score alert severity
    phase: detection
    connector: triage.score
    params: {}
    timeout_seconds: 30
    on_failure: abort

  - id: collect_evidence
    name: Collect authentication evidence
    phase: detection
    connector: evidence.collect
    params:
      artifacts:
        - evidence/authentication-events.csv
        - evidence/windows-eventlog-security.csv
        - evidence/host-inventory.json
    timeout_seconds: 300
    on_failure: continue

  - id: memory_forensics
    name: Volatility memory analysis
    phase: detection
    connector: forensics.volatility
    params:
      plugins:
        - windows.info
        - windows.pslist
        - windows.pstree
        - windows.malfind
        - windows.handles
    timeout_seconds: 600
    on_failure: continue

  - id: extract_iocs
    name: Extract indicators of compromise
    phase: detection
    connector: ioc.extract
    params: {}
    timeout_seconds: 60
    on_failure: continue

  # --- Containment -----------------------------------------------------------
  - id: isolate_source_host
    name: Network-isolate source host
    phase: containment
    connector: estate.isolate_host
    params:
      host_id: "{{ alert.asset.id | HOST-022 }}"
    timeout_seconds: 60
    on_failure: abort

  - id: lock_affected_account
    name: Lock affected account
    phase: containment
    connector: identity.lock_account
    params:
      account_id: "{{ alert.user.account_id | ACC-DMS }}"
    timeout_seconds: 60
    on_failure: continue

  - id: block_attacker_address
    name: Block attacker source address
    phase: containment
    connector: firewall.block
    params:
      zone_from: corp
      zone_to: restricted
      subject: "{{ alert.source.ip | 0.0.0.0/0 }}"
    timeout_seconds: 60
    on_failure: continue

  # --- Eradication -----------------------------------------------------------
  - id: remove_persistence
    name: Remove credential-dumping persistence
    phase: eradication
    connector: eradication.remove_persistence
    params:
      artifact: "{{ alert.context.persistence_artifact | HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Run\\OneDriveSync }}"
      kind: registry_run_key
    timeout_seconds: 60
    on_failure: continue

  - id: quarantine_dumper
    name: Quarantine credential dumping tool
    phase: eradication
    connector: eradication.quarantine_file
    params:
      path: "{{ alert.context.payload_path | C:\\Users\\Public\\mimilib.exe }}"
      reason: Credential dumping tool recovered during memory analysis
    timeout_seconds: 60
    on_failure: continue

  # --- Recovery --------------------------------------------------------------
  - id: verify_containment
    name: Verify containment held
    phase: recovery
    connector: recovery.verify
    params:
      host_id: "{{ alert.asset.id | HOST-022 }}"
      account_id: "{{ alert.user.account_id | ACC-DMS }}"
    timeout_seconds: 60
    on_failure: continue